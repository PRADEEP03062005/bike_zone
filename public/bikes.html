<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Used Bikes | Saimanikanta Bike Zone</title>
  <link rel="stylesheet" href="/css/global.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand">Saimanikanta Bike Zone</a>
      <nav class="site-nav">
        <a href="/">Home</a>
        <a href="/bikes.html">Used Bikes</a>
        <a href="/admin/">Admin</a>
        <a href="/login.html">Login</a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <div class="section-heading-block">
      <p class="eyebrow">Browse bikes</p>
      <h1>Find the right bike for your daily ride.</h1>
      <p>Use the compact search and pickup the most suitable option in seconds.</p>
    </div>

    <div class="filter-card">
      <input type="text" placeholder="Search brand or model" />
      <select>
        <option>All statuses</option>
        <option>Available</option>
        <option>Sold</option>
      </select>
    </div>

    <div class="bike-grid" id="bike-grid">
      <div class="bike-card placeholder">
        <p>Bike inventory will load here once the API is implemented.</p>
      </div>
    </div>
  </main>

  <footer class="site-footer container">
    <p>© 2026 Saimanikanta Bike Zone</p>
  </footer>
  <script type="module" src="/js/bikes.js"></script>
</body>
</html>
