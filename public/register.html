<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Saimanikanta Bike Zone</title>
  <link rel="stylesheet" href="/css/global.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <h1>Create Account</h1>
      <form id="register-form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required />
        <label for="full_name">Full Name</label>
        <input id="full_name" name="full_name" type="text" required />
        <label for="email">Email</label>
        <input id="email" name="email" type="email" />
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required />
        <label for="confirm_password">Confirm Password</label>
        <input id="confirm_password" name="confirm_password" type="password" required />
        <button type="submit" class="button button-primary">Submit Registration</button>
      </form>
      <p class="form-note">Already registered? <a href="/login.html">Login</a></p>
      <div id="register-message" class="form-message"></div>
    </div>
  </div>
  <script type="module">
    import { register } from '/js/auth.js';

    const form = document.getElementById('register-form');
    const message = document.getElementById('register-message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';
      const formData = new FormData(form);
      const password = formData.get('password');
      const confirmPassword = formData.get('confirm_password');

      if (password !== confirmPassword) {
        message.textContent = 'Passwords do not match';
        return;
      }

      const payload = {
        username: formData.get('username'),
        full_name: formData.get('full_name'),
        email: formData.get('email'),
        phone: formData.get('phone'),
        password,
      };

      try {
        await register(payload);
        message.textContent = 'Your registration request has been submitted. An administrator will review your request.';
        form.reset();
      } catch (error) {
        message.textContent = error.message || 'Registration failed';
      }
    });
  </script>
</body>
</html>
